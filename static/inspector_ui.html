<!-- 精准重塑透视镜 (Granular Inspector) 全屏模态窗 -->
<div id="inspectorOverlay" class="fixed inset-0 z-[100] bg-apple-light/95 dark:bg-apple-dark/95 backdrop-blur-2xl hidden opacity-0 transition-opacity duration-300 flex flex-col">
    
    <!-- 顶部状态栏 -->
    <div class="h-16 border-b border-gray-200/80 dark:border-gray-800/80 flex items-center justify-between px-6 shrink-0 bg-white/50 dark:bg-black/50 backdrop-blur-md shadow-sm">
        <h2 class="text-lg font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            选段透视镜 <span class="text-xs font-medium bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400 px-2 py-0.5 rounded-md ml-2">上帝视角</span>
        </h2>
        <div class="flex items-center gap-3">
            <button onclick="window.InspectorSystem.autoDetect()" class="px-4 py-[7px] flex items-center gap-1.5 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600 text-white font-semibold text-[13px] shadow-sm transition-all active:scale-95 mr-4" title="调用后端智能算法，自动锁定标题和参考文献">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                智能侦测屏蔽区
            </button>
            <button onclick="window.InspectorSystem.close()" class="px-5 py-[7px] rounded-full bg-gray-200/80 dark:bg-gray-800/80 text-gray-700 dark:text-gray-300 font-semibold text-[13px] hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors active:scale-95">放弃返回</button>
            <button onclick="window.InspectorSystem.save()" class="px-5 py-[7px] rounded-full bg-[#0071e3] text-white font-semibold text-[13px] shadow-md hover:bg-[#0060c2] transition-colors active:scale-95">保存同步至主页</button>
        </div>
    </div>
    
    <!-- 核心卡片列表区 -->
    <div class="flex-1 overflow-y-auto p-6 md:p-10 space-y-4" id="inspectorCardList">
        <!-- 卡片动态渲染区域 -->
    </div>
    
    <!-- 内部的划词锁定悬浮窗 -->
    <div id="inspectorLockPopup" class="fixed z-[110] hidden opacity-0 transition-opacity duration-200 pointer-events-auto">
        <button onclick="window.InspectorSystem.applyWordLock()" class="flex items-center gap-1.5 px-3 py-[6px] bg-gray-800/95 dark:bg-gray-100/95 text-white dark:text-black rounded-[8px] shadow-xl text-[13px] font-semibold hover:bg-gray-700 dark:hover:bg-white active:scale-95 backdrop-blur-md">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            局部免检
        </button>
    </div>
</div>

<script>
window.InspectorSystem = {
    paragraphs: [],
    currentSelection: null,
    
    init: function() {
        const list = document.getElementById('inspectorCardList');
        if(list) {
            list.addEventListener('mouseup', this.handleSelection.bind(this));
            list.addEventListener('keyup', this.handleSelection.bind(this));
        }
        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('#inspectorLockPopup') && !e.target.closest('.inspector-card')) {
                this.hidePopup();
            }
        });
    },

    open: function() {
        const rawText = document.getElementById('sourceText').value;
        if (!rawText.trim()) {
            if(window.showToast) window.showToast("请输入需要处理的文本", "error");
            return;
        }
        this.paragraphs = rawText.split('\n');
        this.render();
        const overlay = document.getElementById('inspectorOverlay');
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.remove('opacity-0'), 10);
    },
    
    close: function() {
        const overlay = document.getElementById('inspectorOverlay');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
        this.hidePopup();
    },
    
    save: function() {
        const newText = this.paragraphs.join('\n');
        document.getElementById('sourceText').value = newText;
        this.close();
        if(window.handleInput) window.handleInput();
        if(window.showToast) window.showToast('免检区规则已完美同步至主界面', 'success');
    },

    async autoDetect() {
        if(window.showToast) window.showToast("智能探针分析中...", "info");
        try {
            const rawText = this.paragraphs.join('\n');
            const res = await fetch('/api/inspector/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: rawText })
            });
            const data = await res.json();
            
            // 覆盖当前的 paragraphs
            this.paragraphs = data.map(item => {
                let p = item.text;
                let clean = p.replace(/\u200B/g, '').replace(/\u200C/g, '');
                // 如果智能识别建议锁定，且不为空
                if (item.suggest_lock && clean.trim()) {
                    return '\u200B' + clean + '\u200C';
                }
                return p;
            });
            this.render();
            if(window.showToast) window.showToast("智能锁定已完成！", "success");
        } catch (e) {
            if(window.showToast) window.showToast("智能分析失败", "error");
        }
    },
    
    isFullyLocked: function(p) {
        if (!p.startsWith('\u200B') || !p.endsWith('\u200C')) return false;
        const inner = p.substring(1, p.length - 1);
        return !inner.includes('\u200B') && !inner.includes('\u200C');
    },
    
    togglePara: function(idx) {
        let p = this.paragraphs[idx];
        const isCurrentlyFull = this.isFullyLocked(p);
        
        // 1. 获取当前点击的卡片内部的所有关键元素
        const cards = document.querySelectorAll('.inspector-card');
        const card = Array.from(cards).find(c => c.getAttribute('data-idx') == idx);
        
        if (card) {
            const textDiv = card.querySelector('.flex-1');
            const label = card.querySelector('.tracking-wide');
            const switchBg = card.querySelector('.w-11');
            const knob = card.querySelector('.w-5');
            
            // 2. 强行注入渐变过渡动画，并修改颜色状态
            if (isCurrentlyFull) {
                // 解锁动作 -> 变回亮色
                card.className = "inspector-card flex gap-4 p-5 rounded-2xl border bg-white dark:bg-gray-800/90 border-gray-200/80 dark:border-gray-700/80 shadow-md transition-all duration-300";
                textDiv.className = "flex-1 text-[15px] leading-[1.8] text-gray-800 dark:text-gray-200 selection:bg-indigo-200 dark:selection:bg-indigo-900 transition-colors duration-300";
                label.className = "text-[11px] font-bold text-blue-500 tracking-wide transition-colors duration-300";
                label.innerText = "执行重塑";
                switchBg.className = "w-11 h-6 rounded-full relative cursor-pointer transition-colors duration-300 bg-blue-500 shadow-[0_2px_8px_rgba(59,130,246,0.4)]";
                knob.className = "w-5 h-5 bg-white rounded-full absolute top-[2px] transition-transform duration-300 shadow-sm translate-x-[22px]";
                
                // 修改底层数据
                this.paragraphs[idx] = p.substring(1, p.length - 1);
            } else {
                // 上锁动作 -> 变灰暗淡
                card.className = "inspector-card flex gap-4 p-5 rounded-2xl border bg-gray-100/50 dark:bg-gray-800/30 border-gray-200 dark:border-gray-700 opacity-60 grayscale-[50%] transition-all duration-300";
                textDiv.className = "flex-1 text-[15px] leading-[1.8] text-gray-400 dark:text-gray-500 selection:bg-indigo-200 dark:selection:bg-indigo-900 transition-colors duration-300";
                label.className = "text-[11px] font-bold text-gray-400 tracking-wide transition-colors duration-300";
                label.innerText = "原样保留";
                switchBg.className = "w-11 h-6 rounded-full relative cursor-pointer transition-colors duration-300 bg-gray-300 dark:bg-gray-600";
                knob.className = "w-5 h-5 bg-white rounded-full absolute top-[2px] transition-transform duration-300 shadow-sm left-[2px]";
                
                // 修改底层数据
                let clean = p.replace(/\u200B/g, '').replace(/\u200C/g, '');
                this.paragraphs[idx] = '\u200B' + clean + '\u200C';
            }
        }
        
        // 3. 延迟 300 毫秒（等 CSS 渐变动画舒服地播完），再全局重绘，保证 HTML 结构彻底同步！
        setTimeout(() => {
            this.render();
        }, 300);
    },
    
    removeWordLock: function(idx, lockText) {
        let p = this.paragraphs[idx];
        // 还原特定文字的隐身衣
        let target = '\u200B' + lockText + '\u200C';
        this.paragraphs[idx] = p.split(target).join(lockText);
        this.render();
    },
    
    handleSelection: function(e) {
        const selection = window.getSelection();
        const rawText = selection.toString();
        const text = rawText.trim();
        
        if (text.length > 0 && selection.rangeCount > 0) {
            let range = selection.getRangeAt(0);
            let node = range.startContainer;
            let textContainer = node.parentElement ? node.parentElement.closest('.flex-1') : null;
            let card = node.parentElement ? node.parentElement.closest('.inspector-card') : null;
            
            if (card && textContainer) {
                try {
                    let preRange = document.createRange();
                    preRange.selectNodeContents(textContainer);
                    preRange.setEnd(range.startContainer, range.startOffset);
                    let preText = preRange.toString();
                    
                    // 兼容旧版浏览器的前导空格剔除
                    let trimStartOffset = rawText.trimStart ? (rawText.length - rawText.trimStart().length) : (rawText.length - rawText.replace(/^\s+/, '').length);
                    if (trimStartOffset > 0) {
                        preText += rawText.substring(0, trimStartOffset);
                    }
                    
                    let occurrenceIndex = 0;
                    let searchIdx = preText.indexOf(text);
                    while (searchIdx !== -1) {
                        occurrenceIndex++;
                        searchIdx = preText.indexOf(text, searchIdx + 1);
                    }
                    
                    this.currentSelection = {
                        paraIdx: parseInt(card.getAttribute('data-idx')),
                        text: text,
                        occurrenceIndex: occurrenceIndex
                    };
                    
                    const popup = document.getElementById('inspectorLockPopup');
                    if(popup) {
                        popup.style.left = `${e.clientX}px`;
                        popup.style.top = `${e.clientY - 40}px`;
                        popup.classList.remove('hidden');
                        setTimeout(() => popup.classList.remove('opacity-0'), 10);
                    }
                    return;
                } catch (err) {
                    console.error("解析划词坐标失败:", err);
                }
            }
        }
        this.hidePopup();
    },
    
    // ✨ 这个函数之前被你不小心删掉了，现在补回来！
    hidePopup: function() {
        const popup = document.getElementById('inspectorLockPopup');
        if (popup) {
            popup.classList.add('opacity-0');
            setTimeout(() => popup.classList.add('hidden'), 200);
        }
    },
    
    applyWordLock: function() {
        try {
            if (this.currentSelection) {
                const { paraIdx, text, occurrenceIndex } = this.currentSelection;
                let p = this.paragraphs[paraIdx];
                
                if (p && !this.isFullyLocked(p)) {
                    let cleanChars = [];
                    let locked =[];
                    let isLocked = false;
                    
                    // 1. 还原纯字符数组和状态
                    for (let i = 0; i < p.length; i++) {
                        if (p[i] === '\u200B') isLocked = true;
                        else if (p[i] === '\u200C') isLocked = false;
                        else { cleanChars.push(p[i]); locked.push(isLocked); }
                    }
                    
                    let plainText = cleanChars.join('');
                    let matchStart = -1;
                    let currentMatch = 0;
                    let searchIdx = plainText.indexOf(text);
                    
                    // 2. 精准定位第 N 次出现的位置
                    while (searchIdx !== -1) {
                        if (currentMatch === occurrenceIndex) { matchStart = searchIdx; break; }
                        currentMatch++;
                        searchIdx = plainText.indexOf(text, searchIdx + 1);
                    }
                    
                    // 3. 锁定区间
                    if (matchStart !== -1) {
                        for (let i = matchStart; i < matchStart + text.length; i++) locked[i] = true;
                    }
                    
                    // 4. 状态机重新组装
                    let newP = "";
                    let currentlyLocked = false;
                    for (let i = 0; i < cleanChars.length; i++) {
                        if (locked[i] && !currentlyLocked) { newP += '\u200B'; currentlyLocked = true; }
                        else if (!locked[i] && currentlyLocked) { newP += '\u200C'; currentlyLocked = false; }
                        newP += cleanChars[i];
                    }
                    if (currentlyLocked) newP += '\u200C';
                    
                    // ✨ 动效改造开始：
                    const popupBtn = document.querySelector('#inspectorLockPopup button');
                    const originalHtml = popupBtn.innerHTML;
                    const originalClass = popupBtn.className;

                    // 1. 悬浮窗立刻变成绿色打勾
                    popupBtn.innerHTML = `<svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="text-green-400 font-bold tracking-wider">已成功锁定</span>`;
                    popupBtn.className = `flex items-center gap-1.5 px-3 py-[6px] bg-gray-800/95 dark:bg-gray-100/95 rounded-[8px] border border-green-500/50 shadow-[0_0_20px_rgba(74,222,128,0.25)] scale-105 transition-all duration-300 backdrop-blur-md`;

                    // 2. ✨ 核心修改：打破延迟，立刻重绘，透视面板上的灰色块瞬间伴随闪光浮现！
                    window.isInspectorLocking = true;
                    this.paragraphs[paraIdx] = newP;
                    this.render(); 
                    window.isInspectorLocking = false; // 渲染完立刻关掉标志
                    
                    if (window.getSelection) window.getSelection().removeAllRanges();

                    // 3. 让悬浮窗展示 350ms 后退场
                    setTimeout(() => {
                        this.hidePopup();
                        
                        setTimeout(() => {
                            popupBtn.innerHTML = originalHtml;
                            popupBtn.className = originalClass;
                        }, 200);
                    }, 350);
                    
                    // 核心：拦截成功，带动画退出
                    return; 
                }
            }
            
            // 如果没选中有效内容，直接执行清理
            this.hidePopup();
            if (window.getSelection) window.getSelection().removeAllRanges();
            
        } catch (err) {
            console.error("执行锁定失败:", err);
            this.hidePopup();
            if (window.getSelection) window.getSelection().removeAllRanges();
        }
    },
    
    render: function() {
        const container = document.getElementById('inspectorCardList');
        let html = '';
        
        const lockColor = `bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-gray-200 px-1 rounded-md cursor-pointer hover:bg-red-400 hover:text-white dark:hover:bg-red-500 transition-colors mx-[1px] shadow-sm ${window.isInspectorLocking ? 'lock-flash-animate' : ''}`;
        
        this.paragraphs.forEach((p, idx) => {
            const isEmpty = !p.trim().replace(/\u200B/g, '').replace(/\u200C/g, '');
            if (isEmpty) return; // 忽略全空行
            
            const isFull = this.isFullyLocked(p);
            let displayHtml = '';
            
            if (isFull) {
                displayHtml = this.escapeHtml(p.substring(1, p.length - 1));
            } else {
                let currentIdx = 0;
                const regex = /\u200B([^\u200C]*)\u200C/g;
                let m;
                while ((m = regex.exec(p)) !== null) {
                    if (m.index > currentIdx) displayHtml += this.escapeHtml(p.substring(currentIdx, m.index));
                    const safeInner = this.escapeHtml(m[1]).replace(/'/g, "\\'");
                    displayHtml += `<span class="${lockColor}" title="点击取消免检" onclick="window.InspectorSystem.removeWordLock(${idx}, '${safeInner}')">${this.escapeHtml(m[1])}</span>`;
                    currentIdx = regex.lastIndex;
                }
                if (currentIdx < p.length) displayHtml += this.escapeHtml(p.substring(currentIdx));
            }
            
            const cardBg = isFull ? 'bg-gray-100/50 dark:bg-gray-800/30 border-gray-200 dark:border-gray-700 opacity-60 grayscale-[50%]' : 'bg-white dark:bg-gray-800/90 border-gray-200/80 dark:border-gray-700/80 shadow-md';
            
// ================= ✨ 新增：非侵入式 AI 率匹配引擎 =================
        let aiBadgeHtml = '';
        try {
            // 修复：直接读取全局变量 lastDetectReportData，不使用 window 挂载
            if (typeof lastDetectReportData !== 'undefined' && lastDetectReportData && lastDetectReportData.source && lastDetectReportData.source.details) {
                let cleanP = p.replace(/[\u200B\u200C]/g, '').trim();
                let detail = lastDetectReportData.source.details.find(d => d.text.trim() === cleanP);
                if (detail) {
                    if (detail.ignored) {
                        aiBadgeHtml = `<span class="inline-flex items-center justify-center px-1.5 py-[2px] rounded border border-gray-200 dark:border-gray-700 text-[10px] font-bold bg-gray-100 text-gray-500 dark:bg-gray-800 dark:text-gray-400 mb-1.5 mr-2 align-middle shadow-sm">短句免检</span>`;
                    } else {
                        let ratio = (detail.ai_ratio * 100).toFixed(1);
                        let colorCls = detail.ai_ratio < 0.3 ? 'bg-green-50 text-green-600 border-green-200 dark:bg-green-500/10 dark:text-green-400 dark:border-green-800' :
                                       detail.ai_ratio < 0.7 ? 'bg-yellow-50 text-yellow-600 border-yellow-200 dark:bg-yellow-500/10 dark:text-yellow-400 dark:border-yellow-800' :
                                       'bg-red-50 text-red-600 border-red-200 dark:bg-red-500/10 dark:text-red-400 dark:border-red-800';
                        aiBadgeHtml = `<span class="inline-flex items-center justify-center px-1.5 py-[2px] rounded border text-[10px] font-bold font-mono mb-1.5 mr-2 align-middle shadow-sm ${colorCls}">AI: ${ratio}%</span>`;
                    }
                }
            }
        } catch (e) { console.error("AI徽章渲染错误:", e); }
        // ================= ✨ 新增结束 =================

            html += `
            <div class="inspector-card flex gap-4 p-5 rounded-2xl border ${cardBg} transition-all duration-300" data-idx="${idx}">
                <!-- 左侧序号 -->
                <div class="w-8 shrink-0 text-right text-[11px] font-mono text-gray-400 font-bold pt-1.5 opacity-50">
                    #${idx + 1}
                </div>
                <!-- 中间文本 -->
                <div class="flex-1 text-[15px] leading-[1.8] text-gray-800 dark:text-gray-200 selection:bg-indigo-200 dark:selection:bg-indigo-900">
                    ${aiBadgeHtml}${displayHtml}
                </div>
                <!-- 右侧拨动开关 -->
                <div class="shrink-0 flex flex-col items-center justify-center gap-2 pl-4 border-l border-gray-100 dark:border-gray-700/50">
                    <span class="text-[11px] font-bold ${isFull ? 'text-gray-400' : 'text-blue-500'} tracking-wide">
                        ${isFull ? '原样保留' : '执行重塑'}
                    </span>
                    <div class="w-11 h-6 rounded-full relative cursor-pointer transition-colors duration-300 ${isFull ? 'bg-gray-300 dark:bg-gray-600' : 'bg-blue-500 shadow-[0_2px_8px_rgba(59,130,246,0.4)]'}" onclick="window.InspectorSystem.togglePara(${idx})">
                        <div class="w-5 h-5 bg-white rounded-full absolute top-[2px] transition-transform duration-300 shadow-sm ${isFull ? 'left-[2px]' : 'translate-x-[22px]'}"></div>
                    </div>
                </div>
            </div>
            `;
        });
        
        if (!html) {
            html = '<div class="text-center text-gray-400 mt-20">暂无有效段落</div>';
        }
        container.innerHTML = html;
    },
    
    escapeHtml: function(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
};
</script>
